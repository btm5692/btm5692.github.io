<header
  id="site-navbar"
  class="fixed left-0 right-0 top-0 z-[100] overflow-x-hidden bg-background text-foreground shadow-sm backdrop-blur-md"
  role="banner"
>
  <!-- 한 줄 flex: 로고(고정) | 데스크톱 메뉴(남는 공간·우측 정렬) | 모바일 햄버거(우측) -->
  <div class="navbar-inner container mx-auto px-6">
    <div class="flex min-h-[44px] min-w-0 w-full items-center justify-between gap-3 md:gap-4 lg:gap-6">
      <a
        href="index.html"
        class="nav-brand min-w-0 shrink text-primary"
        data-swup-link
        aria-label="해남유스호스텔"
      >
        <img
          src="../assets/images/img_logo.png"
          alt="해남유스호스텔 로고"
          class="nav-logo block h-auto w-auto max-w-full sm:max-w-none"
          width="180"
          height="48"
          loading="eager"
        />
        <span class="sr-only">해남유스호스텔</span>
      </a>

      <div
        id="nav-desktop-slot"
        class="hidden min-w-0 flex-1 md:flex md:items-center md:justify-end"
      ></div>

      <button
        type="button"
        id="mobile-menu-toggle"
        class="mobile-nav-toggle inline-flex h-11 w-11 shrink-0 items-center justify-center rounded-md border border-border bg-background text-foreground md:hidden sm:h-10 sm:w-10"
        aria-label="메뉴 열기"
        aria-expanded="false"
        aria-controls="mobile-menu-panel"
      >
        <svg class="icon-menu h-6 w-6 shrink-0" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M4 6h16M4 12h16M4 18h16" />
        </svg>
        <svg class="icon-close hidden h-6 w-6 shrink-0" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M18 6L6 18M6 6l12 12" />
        </svg>
      </button>
    </div>
  </div>

  <div
    id="mobile-menu-panel"
    class="mobile-menu-panel absolute left-0 right-0 top-full z-[100] hidden border-b border-border bg-background shadow-lg md:hidden"
    role="dialog"
    aria-modal="true"
    aria-label="모바일 내비게이션"
  >
    <div id="nav-mobile-slot" class="p-6"></div>
  </div>
</header>
